name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run build

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 3Y-Dev-Roadmap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 3Y-Dev-Roadmap-apk
          path: 3Y-Dev-Roadmap.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 3Y Dev Roadmap — Android build ${{ github.run_number }}
          body: |
            Download **3Y-Dev-Roadmap.apk** below and open it on your Android phone to install.
            (Allow "Install unknown apps" for your browser / file manager when Android asks.)
          files: 3Y-Dev-Roadmap.apk
          make_latest: true
